name: Build firmware

# Builds the Zen75 (fk/fk2120) firmware.
#  - pull requests and plain manual runs: build only, firmware attached as an artifact
#  - any tag ending in "b" (v0.3.0b, 2026.11b, ...): build and publish a GitHub release
#  - manual run with "release_tag" filled in: build, create that tag on the commit
#    that was built and publish the release (no local git needed)
on:
  push:
    tags:
      - '*b'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create and release, ending in "b" (e.g. v0.3.0b). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: read

env:
  KEYBOARD: fk/fk2120
  KEYMAP: via
  # The emulated EEPROM starts at 0x1F000; the image must end below it.
  MAX_FIRMWARE_BYTES: 126976
  ARM_TOOLCHAIN_VERSION: 13.2.rel1
  ARM_TOOLCHAIN_SHA256: 6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb
  # The pushed tag, or the tag asked for in a manual run (empty when only building).
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag
        if: env.RELEASE_TAG != ''
        run: |
          case "$RELEASE_TAG" in
            *[!A-Za-z0-9._-]*) echo "::error::Tag '$RELEASE_TAG' has characters other than letters, digits, '.', '_' and '-'"; exit 1 ;;
            *b) echo "Releasing $RELEASE_TAG" ;;
            *) echo "::error::Release tags must end in 'b' (got '$RELEASE_TAG')"; exit 1 ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The compiler comes from Arm's release server, pinned by checksum and cached.
      # (Ubuntu's gcc-arm-none-eabi package is the same version, but its mirror
      # repeatedly stalled mid-download on the hosted runners.)
      - name: Cache Arm GNU toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ env.ARM_TOOLCHAIN_SHA256 }}

      - name: Download Arm GNU toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          url="https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --speed-limit 100000 --speed-time 30 -o /tmp/toolchain.tar.xz "$url"
          echo "${ARM_TOOLCHAIN_SHA256}  /tmp/toolchain.tar.xz" | sha256sum -c -
          mkdir -p ~/arm-gnu-toolchain
          tar -xf /tmp/toolchain.tar.xz -C ~/arm-gnu-toolchain --strip-components=1

      - name: Install build tools
        timeout-minutes: 5
        run: |
          echo "$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"
          "$HOME/arm-gnu-toolchain/bin/arm-none-eabi-gcc" --version | head -n 1
          python -m pip install --upgrade pip
          python -m pip install qmk -r requirements.txt

      - name: Build
        run: make "$KEYBOARD:$KEYMAP" SKIP_GIT=yes -j"$(nproc)"

      - name: Check that the default keymap still links
        run: make "$KEYBOARD:default" SKIP_GIT=yes -j"$(nproc)"

      - name: Check firmware size
        run: |
          size=$(stat -c %s .build/fk_fk2120_via.bin)
          echo "Firmware is $size bytes (limit $MAX_FIRMWARE_BYTES)"
          test "$size" -le "$MAX_FIRMWARE_BYTES"

      - name: Collect files
        run: |
          label="${RELEASE_TAG:-${GITHUB_REF_NAME//\//-}}"
          name="zen75_${KEYMAP}_${label}"
          mkdir dist
          cp .build/fk_fk2120_via.bin "dist/${name}.bin"
          cp "keyboards/fk/fk2120/Zen75@Cerakey.JSON" "dist/Zen75@Cerakey.JSON"
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: zen75-firmware
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zen75-firmware
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # For a manual run the tag does not exist yet: --target makes GitHub
          # create it on the commit that was just built.
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Zen75 firmware $RELEASE_TAG" \
            --generate-notes
